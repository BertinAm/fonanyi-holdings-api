---
# cPanel -> Git Version Control runs these when you click "Deploy HEAD Commit".
#
# The repository is cloned directly into the application directory, which is
# also the subdomain's document root:
#
#     ~/api.fonanyiholdingsltd.com   <- git checkout, Passenger app root,
#                                       and the domain's document root
#
# One directory, not two. The previous arrangement kept the checkout in
# ~/repositories/ and rsynced it across to a separate app directory, and every
# problem we had came out of that copy: --delete removed the public/ directory
# Passenger requires, -a stamped the source's 0700 onto the app root, and the
# two could drift apart without anything reporting it.
#
# Nothing is rsynced now. The checkout is the app.
deployment:
  tasks:
    - export APPDIR=/home/$(whoami)/api.fonanyiholdingsltd.com
    - /bin/bash $APPDIR/deploy/deploy.sh
